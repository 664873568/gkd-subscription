name: Sync specific files from upstream  
  
on:  
  schedule:  
    - cron: '0 0 1 * *'   # 每月 1 日 UTC 0 点自动运行  
  workflow_dispatch:       # 支持手动触发  
  
permissions:  
  contents: write  
  workflows: write  
  
jobs:  
  sync:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  
          token: ${{ secrets.GITHUB_TOKEN }}  
  
      - name: Pull latest remote changes  
        run: |  
          git pull origin main --rebase  
  
      - name: Download specified files from upstream  
        run: |  
          UPSTREAM_REPO="gkd-kit/subscription-template"  
          BRANCH="main"  
          FILES=(  
            "pnpm-lock.yaml"  
            "package.json"  
            ".prettierignore"  
            ".github/workflows/build_release.yml"  
            ".github/workflows/check_fix_push.yml"  
            ".github/workflows/pull_request_check.yml"  
          )  
          for FILE in "${FILES[@]}"; do  
            echo "Downloading $FILE ..."  
            mkdir -p "$(dirname "$FILE")"  
            curl -sL -o "$FILE" "https://raw.githubusercontent.com/$UPSTREAM_REPO/$BRANCH/$FILE" || echo "Failed: $FILE"  
          done  
  
      - name: Commit and push if changed  
        run: |  
          git config user.name "github-actions[bot]"  
          git config user.email "github-actions[bot]@users.noreply.github.com"  
          git add -A  
          if git diff --staged --quiet; then  
            echo "No changes to commit."  
          else  
            git commit -m "chore: sync specified files from upstream"  
            git push  
          fi  
        env:  
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
