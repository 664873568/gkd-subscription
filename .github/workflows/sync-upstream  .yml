name: sync-upstream  
  
on:  
  schedule:  
    - cron: '0 0 1 * *'  
  workflow_dispatch:  
  
jobs:  
  sync:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v7  
        with:  
          fetch-depth: 0  
  
      - name: Pull latest remote changes  
        run: |  
          git pull origin main --rebase  
  
      - name: Download specified files from upstream  
        run: |  
          UPSTREAM_REPO="gkd-kit/subscription-template"  
          BRANCH="main"  
          FILES=(  
            "eslint.config.ts"  
            "package.json"  
            "pnpm-lock.yaml"  
            "pnpm-workspace.yaml"  
            "prettier.config.ts"  
            "tsconfig.json"  
            "README.md"  
            ".prettierignore"  
            ".github/workflows/build_release.yml"  
            ".github/workflows/check_fix_push.yml"  
            ".github/workflows/pull_request_check.yml"  
          )  
          for FILE in "${FILES[@]}"; do  
            echo "Downloading $FILE ..."  
            mkdir -p "$(dirname "$FILE")"  
            curl -sL -o "$FILE" "https://raw.githubusercontent.com/$UPSTREAM_REPO/$BRANCH/$FILE" || echo "Failed: $FILE"  
          done  
  
      - name: Commit and push if changed  
        run: |  
          git config user.name "github-actions[bot]"  
          git config user.email "github-actions[bot]@users.noreply.github.com"  
          git add -A  
          if git diff --staged --quiet; then  
            echo "No changes to commit."  
          else  
            git commit -m "chore: sync specified files from upstream"  
            git push  
          fi  
